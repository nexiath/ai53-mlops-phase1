stages:
  validate:
    cmd: uv run --locked python -m src.validate_data
    deps:
      - src/validate_data.py
      - data/raw
      - uv.lock
      - pyproject.toml
    outs:
      - reports/data_quality.json:
          cache: false

  prepare:
    cmd: uv run --locked python -m src.prepare
    deps:
      - src/prepare.py
      - data/raw
      - reports/data_quality.json
      - uv.lock
      - pyproject.toml
    params:
      - data.image_size
    outs:
      - data/processed/train
      - data/processed/validation
      - data/processed/test
      - data/processed/manifests/train.csv
      - data/processed/manifests/validation.csv
      - data/processed/manifests/test.csv
      - reports/data_summary.json:
          cache: false

  train:
    cmd: uv run --locked python -m src.train
    deps:
      - src/train.py
      - src/data.py
      - src/model.py
      - src/provenance.py
      - src/reproducibility.py
      - data/processed/train
      - data/processed/validation
      - data/processed/manifests/train.csv
      - data/processed/manifests/validation.csv
      - uv.lock
      - pyproject.toml
    params:
      - data.image_size
      - train.batch_size
      - train.epochs
      - train.learning_rate
      - train.dropout
      - train.random_state
      - augmentation.enabled
      - augmentation.horizontal_flip
      - augmentation.rotation_degrees
      - compute.device
      - tracking.uri
      - tracking.experiment
    outs:
      - models/model.pt
      - reports/training_curves.png:
          cache: false
      - reports/run_manifest.json:
          cache: false
    metrics:
      - reports/train_summary.json:
          cache: false

  evaluate:
    cmd: uv run --locked python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/data.py
      - src/provenance.py
      - src/reproducibility.py
      - data/processed/test
      - data/processed/manifests/train.csv
      - data/processed/manifests/validation.csv
      - data/processed/manifests/test.csv
      - uv.lock
      - pyproject.toml
    params:
      - selection.run_id
      - data.image_size
      - evaluation.batch_size
      - compute.device
      - tracking.uri
      - tracking.experiment
    outs:
      - reports/test_confusion_matrix.png:
          cache: false
    metrics:
      - reports/test_metrics.json:
          cache: false
